# Deploys the study on every push to main:
#   1. the upload service (worker/) to Cloudflare, with the GitHub token as its secret
#   2. the study page to GitHub Pages, with config.js pointing at that upload service
# Repository secrets needed: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, RESULTS_TOKEN.
# Settings -> Pages -> Source must be "GitHub Actions".
name: Deploy the study

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  upload-service:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.address.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the upload service
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            RESULTS_TOKEN
        env:
          RESULTS_TOKEN: ${{ secrets.RESULTS_TOKEN }}
      - name: Find its address
        id: address
        env:
          OUTPUT: ${{ steps.deploy.outputs.command-output }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          base=$(printf '%s' "$OUTPUT" | grep -o 'https://[A-Za-z0-9.-]*workers\.dev' | head -1)
          if [ -z "$base" ]; then
            sub=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain')
            base="https://quantacolony-study-upload.$sub.workers.dev"
          fi
          echo "Upload service: $base"
          echo "url=$base/upload" >> "$GITHUB_OUTPUT"

  page:
    needs: upload-service
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        env:
          UPLOAD_URL: ${{ needs.upload-service.outputs.url }}
        run: |
          mkdir _site
          cp -r index.html app assets study.json _site/
          (cd python && zip -qr ../_site/python.zip quantacolony)
          printf 'window.STUDY_CONFIG = { uploadUrl: "%s", contact: "Alejandro Navarro" };\n' "$UPLOAD_URL" > _site/config.js
          cat _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
